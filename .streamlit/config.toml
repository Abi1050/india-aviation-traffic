# Theme colours are set here (Streamlit's supported mechanism) instead of
# overriding generated CSS classes, so text stays readable on every component.
[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F4F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B4D"
linkColor = "#2563EB"
borderColor = "#DCE5EF"
dataframeHeaderBackgroundColor = "#EEF3F9"
showWidgetBorder = true
baseRadius = "0.6rem"
font = "sans-serif"
headingFontWeights = [700, 700]
chartCategoricalColors = ["#2563EB", "#0D9488", "#F59E0B", "#7C3AED", "#DB2777", "#0EA5E9"]

[theme.sidebar]
backgroundColor = "#0B1F33"
secondaryBackgroundColor = "#13304D"
textColor = "#E6EDF5"
linkColor = "#7DD3FC"
primaryColor = "#38BDF8"
borderColor = "#24456A"

[server]
maxUploadSize = 20
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
